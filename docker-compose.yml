services:
  ghalem-store:
    build: .
    container_name: ghalem-store-pro
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/ghalem-store.db
      - UPLOAD_DIR=/app/data/uploads
      # REQUIRED: generate with: node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set in your .env file}
    volumes:
      # SQLite database + receipt uploads persist across restarts/rebuilds
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
